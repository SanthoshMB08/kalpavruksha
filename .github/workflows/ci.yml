name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kalpavruksha_test
        ports:
          - 5432:5432
        # Waits for Postgres to actually be ready before the job proceeds —
        # without this, the app can try to connect before the container has
        # finished starting up and fail the whole run on a false negative.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      SESSION_SECRET: ci_test_session_secret
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kalpavruksha_test
      DB_SSL: 'false'
      STORAGE_PROVIDER: local
      SUPERADMIN_USERNAME: superadmin
      SUPERADMIN_PASSWORD: CiTestPass123
      SUPERADMIN_MOBILE: '9999999999'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Run tests
        run: npm test
